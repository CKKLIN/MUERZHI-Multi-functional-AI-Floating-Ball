<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>二支录制</title>
  </head>
  <body>
    <!--
      加载占位：#app 在 Vue 挂载前是空的，主窗口又是 visible:false 预定义的，
      冷启动时 Vite 编译依赖实测要 100s 以上（实测 16:53:11 启动 → 16:55:04 就绪）。
      这段时间里若把窗口显示出来，用户看到的就是一片背景色空白。挂个占位让它
      显示「加载中」，app.mount('#app') 会整体替换掉 #app 的内容。
    -->
    <div id="app">
      <div id="boot-splash">
        <div class="spinner"></div>
        <p>加载中…</p>
      </div>
    </div>
    <style>
      html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden; background: transparent; }
      body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      #app { height: 100%; width: 100%; overflow: hidden; background: transparent; }
      #boot-splash {
        height: 100%;
        width: 100%;
        border-radius: 12px;
        border: 1px solid #d0d0d8;
        box-sizing: border-box;
        background: #eaeaec;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: #6b6b70;
        font-size: 13px;
      }
      .spinner {
        width: 22px;
        height: 22px;
        border: 2px solid rgba(0, 0, 0, 0.12);
        border-top-color: rgba(0, 0, 0, 0.38);
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .spinner { animation: none; }
      }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
