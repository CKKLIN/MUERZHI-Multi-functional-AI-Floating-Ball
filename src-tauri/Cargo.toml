[package]
name = "muerzhi"
version = "1.1.1"
description = "MUERZHI 万能 AI 悬浮球 — Tauri 后端"
authors = ["muerzhi"]
edition = "2021"

# 打包时由 tauri bundler 读取，作为 Windows 安装包元数据
[package.metadata.bundle]
identifier = "com.muerzhi.aiball"

[lib]
name = "muerzhi_lib"
# 桌面专有：去掉 cdylib（Windows 下其产物 muerzhi_lib.dll 与测试 harness 同名，
# 会让 cargo test 加载到缺符号的 dll 报 STATUS_ENTRYPOINT_NOT_FOUND）
# cdylib 必须保留：其内嵌的 Windows manifest（comctl32 v6 激活上下文）会让
# cargo test 的 harness 也能解析 TaskDialogIndirect——少了它测试进程报
# STATUS_ENTRYPOINT_NOT_FOUND（rlib-only 实测必挂）
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico", "devtools"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["time", "rt-multi-thread", "net", "io-util", "sync", "process"] }
axum = "0.8"
# P4 录制管线依赖（WGC + WASAPI）
windows-capture = { version = "2", optional = true }
wasapi = { version = "0.24", optional = true }
# 缩略图/截图：PNG 字节转 data URL 直接喂渲染层 <img>
base64 = "0.22"

# 截图文件名用本地时间（std 只给 UTC）：取时区偏移，避免文件名差几个小时
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Time", "Win32_Foundation", "Win32_Graphics_Gdi"] }
# 放行 WebView2 的摄像头/麦克风权限（getUserMedia 默认弹确认框，无边框窗里用户点不到）
webview2-com = "0.38"

# P4 录制管线开关（WGC + WASAPI）
# 默认开启：录制是核心功能，出厂构建（含 NSIS 安装包）必须带采集管线；
# `--no-default-features` 只用于快速 cargo check 时跳过 WGC/WASAPI 重编译。
[features]
default = ["screen-capture"]
screen-capture = ["dep:windows-capture", "dep:wasapi"]
# 测试专用：打开 tauri 的 mock 运行时，用于需要 AppHandle 的单元测试。
# 不能进 default —— mock_app 造出的 AppHandle<MockRuntime> 与生产代码的
# AppHandle<Wry> 不同型，凡签名写死 Wry 的函数都用不了它；当前单元测试都经过
# 纯函数化改造，暂未用到，保留开关供后续需要时启用（cargo test --features test）。
test = ["tauri/test"]

[profile.release]
# 与 electron-builder 的 compression: maximum 对齐，安装包尽量小
lto = true
codegen-units = 1
strip = true
opt-level = "s"

# 单元测试入口（见 tests/unit.rs 顶部注释：Windows 下 manifest 需显式 test target）
[[test]]
name = "unit"
path = "tests/unit.rs"
