<!DOCTYPE html>
<html><head><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
.preview{
  width:100%;height:100%;
  border-radius:8px;
  overflow:hidden;
  border:2px solid rgba(255,255,255,0.25);
  box-shadow:0 4px 16px rgba(0,0,0,0.4);
  background:#000;
  cursor:grab;
  -webkit-user-select:none;
  user-select:none;
}
.preview.dragging{cursor:grabbing}
.preview video{
  width:100%;height:100%;
  object-fit:cover;
  display:block;
  transform:scaleX(-1);
  pointer-events:none;
}
</style></head><body>
<div class="preview" id="preview"><video id="cam" autoplay muted playsinline></video></div>
<script>
const {ipcRenderer}=require('electron');
const params=new URLSearchParams(window.location.search);
const deviceId=params.get('deviceId')||'';
let cameraStream=null;

async function startCamera(){
  try{
    const constraints={video:{width:320,height:240}};
    if(deviceId)constraints.video.deviceId={exact:deviceId};
    cameraStream=await navigator.mediaDevices.getUserMedia(constraints);
    document.getElementById('cam').srcObject=cameraStream;
  }catch(err){console.error('Camera preview failed:',err)}
}

function stopCamera(){
  if(cameraStream){
    cameraStream.getTracks().forEach(t=>t.stop());
    cameraStream=null;
  }
}

ipcRenderer.on('camera-control',(e,action)=>{
  if(action==='stop')stopCamera();
  else if(action==='start')startCamera();
});

const preview=document.getElementById('preview');

document.addEventListener('mousedown',(e)=>{
  preview.classList.add('dragging');
  ipcRenderer.send('camera-drag-start');
  e.preventDefault();
});

document.addEventListener('mouseup',()=>{
  preview.classList.remove('dragging');
  ipcRenderer.send('camera-drag-end');
});

startCamera();
</script>
</body></html>
