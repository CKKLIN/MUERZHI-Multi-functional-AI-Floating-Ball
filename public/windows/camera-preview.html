<!DOCTYPE html>
<!-- 摄像头预览 — Tauri 版（移植自 electron/camera-preview.html）
     变更：ipcRenderer 的 camera-control → window.__TAURI__ event listen；
     拖拽事件 camera-drag-start/end → invoke（Rust 侧 16ms 轮询跟随，对齐 TS 实现）-->
<html><head><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
.preview{
  width:100%;height:100%;
  border-radius:8px;
  overflow:hidden;
  box-shadow:0 4px 16px rgba(0,0,0,0.4);
  background:#000;
  cursor:grab;
  -webkit-user-select:none;
  user-select:none;
}
.preview.dragging{cursor:grabbing}
.preview video{
  width:100%;height:100%;
  object-fit:cover;
  display:block;
  transform:scaleX(-1);
  pointer-events:none;
}
</style></head><body>
<div class="preview" id="preview"><video id="cam" autoplay muted playsinline></video></div>
<script>
const invoke = window.__TAURI__.core.invoke
const listen = window.__TAURI__.event.listen

const params = new URLSearchParams(window.location.search)
const deviceId = params.get('deviceId') || ''
let cameraStream = null

async function startCamera() {
  if (cameraStream) return
  try {
    const constraints = { video: { width: 320, height: 240 } }
    if (deviceId) constraints.video.deviceId = { exact: deviceId }
    cameraStream = await navigator.mediaDevices.getUserMedia(constraints)
    document.getElementById('cam').srcObject = cameraStream
  } catch (err) {
    console.error('Camera preview failed:', err)
  }
}

function stopCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop())
    cameraStream = null
  }
}
// Rust eval 入口（hide_camera_preview 时先停流再关窗，防硬件会话泄漏）
window.startCamera = startCamera
window.stopCamera = stopCamera

// Rust 侧 camera-control 事件（start/stop）
listen('camera-control', (ev) => {
  if (ev.payload === 'stop') stopCamera()
  else if (ev.payload === 'start') startCamera()
})

// ===== 画中画录制（供 Rust 侧 ffmpeg overlay 合成）=====
// 摄像头流由本窗持有（WebView2 的 getUserMedia），Rust 拿不到，所以由这里录成 webm
// 追加落盘；停止后 Rust 把这段 webm 叠到主视频上。
let recorder = null
let recordPath = ''

async function startRecording(path) {
  if (recorder) return
  await startCamera()
  if (!cameraStream) {
    // 摄像头没起来：立刻回报「已结束」，否则 Rust 侧 stop 会白等 3 秒超时
    invoke('camera_record_finished', { filePath: path }).catch(() => {})
    return
  }
  recordPath = path
  const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']
    .find((m) => MediaRecorder.isTypeSupported(m)) || 'video/webm'
  recorder = new MediaRecorder(cameraStream, { mimeType: mime, videoBitsPerSecond: 2_000_000 })
  let first = true
  // 追加写是异步 IPC：必须串成链并在 onstop 里等链尾落完再回报 Rust，
  // 否则最后一块（含 webm 尾部）可能还在飞，Rust 已经拿半截文件去 overlay。
  let flushing = Promise.resolve()
  recorder.ondataavailable = (e) => {
    if (!e.data || e.data.size === 0) return
    const blob = e.data
    const isFirst = first
    first = false
    flushing = flushing.then(async () => {
      const buf = new Uint8Array(await blob.arrayBuffer())
      await invoke('append_file', { filePath: recordPath, data: Array.from(buf), reset: isFirst })
    }).catch((err) => console.error('camera chunk append failed:', err))
  }
  recorder.onstop = async () => {
    recorder = null
    await flushing
    // 通知 Rust 已落盘（Rust 在停止流程里等这个信号再启动 overlay）
    invoke('camera_record_finished', { filePath: recordPath }).catch(() => {})
  }
  recorder.start(1000)
}

function stopRecording() {
  if (recorder && recorder.state !== 'inactive') recorder.stop()
}

window.startRecording = startRecording
window.stopRecording = stopRecording

const preview = document.getElementById('preview')

document.addEventListener('mousedown', (e) => {
  preview.classList.add('dragging')
  invoke('camera_drag_start')
  e.preventDefault()
})

document.addEventListener('mouseup', () => {
  preview.classList.remove('dragging')
  invoke('camera_drag_end')
})

startCamera()
</script>
</body></html>
