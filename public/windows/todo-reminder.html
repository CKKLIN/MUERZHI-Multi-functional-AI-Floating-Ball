<!DOCTYPE html>
<!-- 待办到期提醒弹窗 — 移植自 todo-reminder-window.ts buildReminderHtml()
     自绘 always-on-top 小窗（头部 MUERZHI + 呼吸圈），常驻直到用户点✕/打开待办。
     标题与正文经 window.setReminder(title, body) 由 Rust 注入。 -->
<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:transparent;font-family:'Segoe UI',system-ui,sans-serif}
.card{height:100%;border-radius:14px;background:#ffffff;border:1px solid #e3e4ea;display:flex;flex-direction:column;overflow:hidden}
.bar{height:30px;background:#f1f2f5;border-bottom:1px solid #e0e1e7;display:flex;align-items:center;padding:0 6px 0 10px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:7px}
.logo{width:16px;height:16px;border-radius:4px;object-fit:cover;display:block}
.brand-txt{font-size:12px;color:#2a2a3a;letter-spacing:2px;font-weight:700}
.bar-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.ring{font-size:10px;color:#f59e0b;animation:breathe 1.2s ease-in-out infinite}
/* 提醒窗可能常驻数小时：用户切走（窗口失焦/最小化到看不见）时停掉呼吸动画，
   不让一个 1.2s 的无限动画白撑渲染管线 */
.ring.idle-anim{animation-play-state:paused}
@keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}
.close{width:26px;height:26px;border:none;border-radius:6px;background:transparent;color:#8a8a96;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.close:hover{background:#4e5cd4;color:#fff}
.body{padding:10px 12px 12px;display:flex;flex-direction:column;flex:1;min-height:0}
.t{font-size:14px;font-weight:700;color:#1d1d1f;line-height:1.35;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.b{font-size:12px;color:#6e6e76;line-height:1.5;margin-top:4px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.foot{margin-top:auto;display:flex;justify-content:flex-end;padding-top:8px}
.open{border:none;border-radius:8px;background:#4e5cd4;color:#fff;font-size:11px;font-weight:600;padding:5px 12px;cursor:pointer}
.open:hover{background:#404db9}
</style></head><body><div class="card">
  <div class="bar" data-tauri-drag-region>
    <div class="brand"><img class="logo" src="/logo.png"><div class="brand-txt">MUERZHI</div></div>
    <div class="bar-right">
      <div class="ring" id="ring">到点了</div>
      <button class="close" id="closeBtn">✕</button>
    </div>
  </div>
  <div class="body">
    <div class="t" id="title">待办提醒</div>
    <div class="b" id="body"></div>
    <div class="foot"><button class="open" id="openBtn">打开待办</button></div>
  </div>
</div>
<script>
const emit = window.__TAURI__.event.emit
const invoke = window.__TAURI__.core.invoke

let I18N = { ring: '到点了', title: '待办提醒', body: '', openTodo: '打开待办' }
invoke('get_app_i18n').then((b) => {
  const m = b.messages || {}
  I18N.ring = m['todo.reminderRing'] || I18N.ring
  I18N.title = m['todo.reminTitle'] || I18N.title
  I18N.openTodo = m['todo.openTodo'] || I18N.openTodo
  document.getElementById('ring').textContent = I18N.ring
  document.getElementById('openBtn').textContent = I18N.openTodo
}).catch(() => {})

document.getElementById('closeBtn').addEventListener('click', () => emit('todo-reminder-close'))
document.getElementById('openBtn').addEventListener('click', () => emit('todo-reminder-open'))

// 页面不可见时暂停呼吸动画（visibilitychange 对原生窗同样生效）
document.addEventListener('visibilitychange', () => {
  document.getElementById('ring').classList.toggle('idle-anim', document.hidden)
})

/** Rust 注入提醒内容（escape 由 Rust 侧 to_string 完成，这里只用 textContent 防注入） */
window.setReminder = function (title, body) {
  document.getElementById('title').textContent = title || I18N.title
  document.getElementById('body').textContent = body || ''
}
</script></body></html>
