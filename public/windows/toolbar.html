<!DOCTYPE html>
<!-- 录制工具条 — 区域录制的控制条（贴选区上/下沿或压在选区内部）
     状态机经 applyToolbarState(state, elapsed) 由 Rust eval 推送：
     idle / recording / paused 三态切换按钮可见性；
     按钮点击统一 emit('toolbar-action', <action>) 由 Rust 转发主窗口。
     视觉与悬浮岛（island.html）同一套：高透深色磨砂玻璃 + 细腻光影与内联 SVG 图标。 -->
<html>
<head>
<meta charset="utf-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; }
html, body { width:100%; height:100%; overflow:hidden; background:transparent; }
body {
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
}

/* 高级深色拟态磨砂玻璃 */
.toolbar {
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 10px;
  background: linear-gradient(180deg, rgba(28, 31, 40, 0.94) 0%, rgba(14, 16, 22, 0.98) 100%);
  color: #f1f5f9;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 12px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'Microsoft YaHei', sans-serif;
  font-size: 12px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(28px) saturate(180%);
  -webkit-backdrop-filter: blur(28px) saturate(180%);
  overflow: hidden;
  container-type: inline-size;
  container-name: tb;
  transition: box-shadow .24s ease, border-color .24s ease;
}

/* 选区上方吸附时：下边缘微切角与红框齐平 */
body[data-pos="top"] .toolbar { border-radius: 12px 12px 5px 5px; }
/* 选区内部吸附时：上边缘微切角与红框齐平 */
body[data-pos="inside"] .toolbar { border-radius: 5px 5px 12px 12px; }

/* 录制态微红光 */
body.recording .toolbar {
  border-color: rgba(255, 77, 106, 0.5);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 77, 106, 0.35);
}

/* 暂停态琥珀光 */
body.paused .toolbar {
  border-color: rgba(251, 191, 36, 0.5);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(251, 191, 36, 0.35);
}

/* 设备组 */
.dev-group {
  display: flex;
  align-items: center;
  gap: 3px;
  flex: 0 0 auto;
}

/* 状态组：指示点、时间、选区尺寸 */
.status-group {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 4px;
  flex: 0 0 auto;
}

.rec-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.24);
  transition: background .25s ease, box-shadow .25s ease;
}
body.recording .rec-dot {
  background: #ff4d6a;
  box-shadow: 0 0 8px rgba(255, 77, 106, 0.9);
  animation: dotPulse 1.4s ease-in-out infinite;
}
body.paused .rec-dot {
  background: #fbbf24;
  box-shadow: 0 0 6px rgba(251, 191, 36, 0.75);
}
@keyframes dotPulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: .75; transform: scale(.88); }
}

.timer {
  font: 600 13px/1 ui-monospace, 'SF Pro Text', 'Cascadia Mono', Consolas, monospace;
  font-variant-numeric: tabular-nums;
  letter-spacing: .3px;
  color: #f1f5f9;
  min-width: 42px;
}
body.paused .timer { color: #fbbf24; }

.size-label {
  font: 11px/1 ui-monospace, -apple-system, BlinkMacSystemFont, sans-serif;
  color: #94a3b8;
  padding: 2px 6px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.08);
  white-space: nowrap;
  letter-spacing: .2px;
}

/* 分隔线 */
.divider {
  width: 1px;
  height: 18px;
  background: rgba(255, 255, 255, 0.12);
  flex: 0 0 auto;
}

/* 按钮通用 */
.btn {
  width: 30px;
  height: 30px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: #94a3b8;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .16s cubic-bezier(.4, 0, .2, 1);
  flex: 0 0 auto;
}
.btn:hover {
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
}
.btn:active {
  transform: scale(0.92);
}
.btn:focus-visible {
  outline: 2px solid rgba(233, 69, 96, 0.6);
  outline-offset: 1px;
}
.btn svg {
  width: 16px;
  height: 16px;
  display: block;
}

/* 开关态（麦克风/摄像头已开启） */
.btn.on {
  color: #10b981;
  background: rgba(16, 185, 129, 0.16);
  box-shadow: inset 0 0 0 1px rgba(16, 185, 129, 0.32);
}
.btn.on:hover {
  background: rgba(16, 185, 129, 0.25);
}

/* 电平表 */
.meter {
  display: none;
  gap: 2px;
  align-items: flex-end;
  height: 14px;
  width: 26px;
  flex: 0 0 auto;
  padding: 0 1px;
}
body.mic-on .meter { display: flex; }
.meter-bar {
  width: 2px;
  height: 4px;
  background: rgba(255, 255, 255, 0.16);
  border-radius: 1.5px;
  transition: height .08s ease, background .08s ease;
}
.meter-bar.on {
  height: 13px;
  background: #10b981;
  box-shadow: 0 0 4px rgba(16, 185, 129, 0.5);
}
.meter-bar.warn {
  background: #fbbf24;
  box-shadow: 0 0 4px rgba(251, 191, 36, 0.5);
}
.meter-bar.hot {
  background: #ff4d6a;
  box-shadow: 0 0 4px rgba(255, 77, 106, 0.5);
}

/* 主操作组：固定 66px 槽位，避免待机与录制切换时产生位移抖动 */
.main-group {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 66px;
  flex: 0 0 auto;
}

/* 开始录制：精美红圈主按钮 */
.btn.primary {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: linear-gradient(135deg, #ff5370 0%, #e94560 100%);
  color: #fff;
  box-shadow: 0 2px 10px rgba(233, 69, 96, 0.45);
}
.btn.primary:hover {
  background: linear-gradient(135deg, #ff6b84 0%, #f0526c 100%);
  box-shadow: 0 3px 12px rgba(233, 69, 96, 0.6);
  transform: scale(1.04);
}
.btn.primary:active {
  transform: scale(0.92);
}

/* 暂停/继续 */
.btn.pause-btn, .btn.resume-btn {
  background: rgba(255, 255, 255, 0.08);
  color: #f1f5f9;
  border: 1px solid rgba(255, 255, 255, 0.08);
}
.btn.pause-btn:hover, .btn.resume-btn:hover {
  background: rgba(255, 255, 255, 0.16);
  border-color: rgba(255, 255, 255, 0.18);
}
.btn.resume-btn { color: #fbbf24; }

/* 停止录制 */
.btn.stop {
  background: linear-gradient(135deg, #ff5370 0%, #e94560 100%);
  color: #fff;
  box-shadow: 0 2px 10px rgba(233, 69, 96, 0.45);
}
.btn.stop:hover {
  background: linear-gradient(135deg, #ff6b84 0%, #f0526c 100%);
  box-shadow: 0 3px 12px rgba(233, 69, 96, 0.6);
  transform: scale(1.04);
}
.btn.stop:active {
  transform: scale(0.92);
}

/* 关闭按钮 */
.btn.close-btn:hover {
  background: rgba(255, 77, 106, 0.16);
  color: #ff4d6a;
}

/* 容器查询自适应降级 */
@container tb (max-width: 330px) {
  .size-label { display: none; }
}
@container tb (max-width: 270px) {
  .divider.opt { display: none; }
}

[hidden] { display: none !important; }
</style>
</head>
<body data-pos="top">
<div class="toolbar" id="toolbar">
  <!-- 设备组：麦克风、电平表、摄像头 -->
  <div class="dev-group">
    <button class="btn toggle" id="micBtn" title="麦克风">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2.5" width="6" height="11" rx="3"/>
        <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>
      </svg>
    </button>
    <div class="meter" id="micMeter"></div>
    <button class="btn toggle" id="camBtn" title="摄像头">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.5" y="6.5" width="13" height="11" rx="3"/>
        <path d="M15.5 11.2 21 8.2v7.6l-5.5-3"/>
      </svg>
    </button>
  </div>

  <span class="divider dev-sep"></span>

  <!-- 状态信息组：指示点、时间、选区尺寸 -->
  <div class="status-group">
    <span class="rec-dot" id="recDot"></span>
    <span class="timer" id="timer">00:00</span>
    <span class="size-label opt" id="sizeLabel"></span>
  </div>

  <span class="divider opt"></span>

  <!-- 主操作组：开始/停止/暂停/继续 -->
  <div class="main-group" id="mainGroup">
    <button class="btn primary" id="startBtn" title="开始录制">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="currentColor"/></svg>
    </button>
    <button class="btn pause-btn" id="pauseBtn" title="暂停" hidden>
      <svg viewBox="0 0 24 24"><rect x="7" y="6" width="3" height="12" rx="1.5" fill="currentColor"/><rect x="14" y="6" width="3" height="12" rx="1.5" fill="currentColor"/></svg>
    </button>
    <button class="btn resume-btn" id="resumeBtn" title="继续" hidden>
      <svg viewBox="0 0 24 24"><path d="M8 5.5 19 12 8 18.5z" fill="currentColor"/></svg>
    </button>
    <button class="btn stop" id="stopBtn" title="停止录制" hidden>
      <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/></svg>
    </button>
  </div>

  <button class="btn close-btn" id="closeBtn" title="关闭">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
      <path d="M6.5 6.5l11 11M17.5 6.5 6.5 17.5"/>
    </svg>
  </button>
</div>

<script>
const emit = window.__TAURI__.event.emit

// 音频电平表（8 根）
const METER_BARS = 8
const meterEl = document.getElementById('micMeter')
const bars = []
for (let i = 0; i < METER_BARS; i++) {
  const bar = document.createElement('div')
  bar.className = 'meter-bar'
  meterEl.appendChild(bar)
  bars.push(bar)
}

let state = 'idle'
let elapsed = 0
let timerInterval = null

function formatTime(sec) {
  const m = Math.floor(sec / 60)
  const s = sec % 60
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0')
}

function renderTimer() {
  document.getElementById('timer').textContent = formatTime(elapsed)
}

function setButtons(s) {
  const startEl = document.getElementById('startBtn')
  const pauseEl = document.getElementById('pauseBtn')
  const resumeEl = document.getElementById('resumeBtn')
  const stopEl = document.getElementById('stopBtn')
  if (startEl) startEl.hidden = s !== 'idle'
  if (pauseEl) pauseEl.hidden = s !== 'recording'
  if (resumeEl) resumeEl.hidden = s !== 'paused'
  if (stopEl) stopEl.hidden = s === 'idle'
}

function startTicking() {
  if (timerInterval) return
  timerInterval = setInterval(() => { elapsed++; renderTimer() }, 1000)
}
function stopTicking() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null }
}

/** Rust 侧状态推送入口 */
function applyToolbarState(s, seconds) {
  state = s
  if (typeof seconds === 'number') elapsed = seconds
  if (s === 'recording') {
    renderTimer()
    startTicking()
  } else if (s === 'paused') {
    renderTimer()
    stopTicking()
  } else {
    elapsed = 0
    renderTimer()
    stopTicking()
  }
  setButtons(s)
  document.body.classList.toggle('recording', s === 'recording')
  document.body.classList.toggle('paused', s === 'paused')
}
window.applyToolbarState = applyToolbarState

/** 开关态（麦克风/摄像头）：点亮对应按钮 */
window.applyIslandControls = function (c) {
  if (!c) return
  document.getElementById('micBtn')?.classList.toggle('on', !!c.mic)
  document.getElementById('camBtn')?.classList.toggle('on', !!c.cam)
  document.body.classList.toggle('mic-on', !!c.mic)
}

/** 音频电平更新 */
window.updateMeter = function (micLevel) {
  const active = micLevel <= 0 ? 0 : Math.round(micLevel * METER_BARS)
  bars.forEach((bar, i) => {
    bar.classList.toggle('on', i < active)
    bar.classList.toggle('warn', i >= 5 && i < active)
    bar.classList.toggle('hot', i >= 6 && i < active)
  })
}

// 按钮动作监听：统一转发 toolbar-action
const actions = {
  micBtn: 'toggle-mic',
  camBtn: 'toggle-camera',
  startBtn: 'start',
  stopBtn: 'stop',
  pauseBtn: 'pause',
  resumeBtn: 'resume',
  closeBtn: 'close',
}
for (const [id, action] of Object.entries(actions)) {
  document.getElementById(id)?.addEventListener('click', () => emit('toolbar-action', action))
}

const query = new URLSearchParams(location.search)
const w = query.get('w')
const h = query.get('h')
if (w && h) {
  const sizeEl = document.getElementById('sizeLabel')
  if (sizeEl) sizeEl.textContent = `${w} × ${h}`
}

window.applyIslandControls({ mic: query.get('mic') === '1', cam: query.get('cam') === '1' })
applyToolbarState('idle', 0)
</script>
</body>
</html>
