<!DOCTYPE html>
<!-- AI 悬浮岛 — 移植自 electron/main/ai-island.ts buildAiIslandHtml()
     Electron 版是 data:URL 内联（require('electron') + 运行时 require question-card-utils.js）；
     Tauri 改为真实文件 + ES module import（同一个 question-card-utils.js 走模块导入）。
     状态经 window.applyState/applyCard/setFlat（Rust eval 推送）+ listen 事件双通道。 -->
<html>
<head>
<meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  background:transparent;
}
body{
  padding-top:4px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  transition:padding-top 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
body.flat{padding-top:0}
.island{
  position:relative;
  width:88px;height:38px;
  background:rgba(18,18,30,0.96);
  border-radius:20px;
  display:flex;flex-direction:column;
  border:1px solid rgba(255,255,255,0.12);
  box-shadow:0 4px 18px rgba(0,0,0,0.38), 0 0 0 1px rgba(255,255,255,0.04);
  transition:width 0.32s cubic-bezier(0.16, 1, 0.3, 1),
             height 0.32s cubic-bezier(0.16, 1, 0.3, 1),
             border-radius 0.28s cubic-bezier(0.16, 1, 0.3, 1),
             border-color 0.28s ease,
             background 0.25s ease,
             box-shadow 0.3s ease,
             opacity 0.25s,
             transform 0.25s;
  overflow:hidden;
  transform-origin:top center;
  box-sizing:border-box;
  flex-shrink:0;
}
.island:not(.expanded):not(.has-card):hover{
  border-color:rgba(255,255,255,0.22);
  box-shadow:0 6px 20px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.08);
}
.island.expanded,.island.has-card{
  max-width:520px;
  border-radius:14px;
  background:rgba(16,16,28,0.98);
  box-shadow:0 12px 36px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.06);
}
.island.has-card{min-width:320px}
.island.hidden{opacity:0;transform:translateY(-8px) scaleY(0.5);pointer-events:none}
.island-row{
  display:flex;align-items:center;justify-content:center;
  gap:6px;flex:0 0 auto;height:36px;padding:0 13px;
  cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:none;
  border-bottom:1px solid transparent;
  transition:background 0.15s,
             border-color 0.24s ease,
             height 0.32s cubic-bezier(0.16, 1, 0.3, 1),
             padding 0.32s cubic-bezier(0.16, 1, 0.3, 1),
             border-radius 0.28s cubic-bezier(0.16, 1, 0.3, 1);
  border-radius:20px;
  width:100%;box-sizing:border-box;
}
.island-row:hover{background:rgba(255,255,255,0.06)}
.island-row.dragging{cursor:grabbing}
.island.expanded .island-row,.island.has-card .island-row{
  justify-content:space-between;
  flex:0 0 auto;padding:0 12px;height:36px;
  border-bottom-color:rgba(255,255,255,0.07);
  border-radius:14px 14px 0 0;
  background:rgba(255,255,255,0.02);
  width:100%;
}
.ai-indicator{
  display:flex;align-items:center;gap:6px;flex-shrink:0;white-space:nowrap;
  transform:scale(1);transform-origin:center center;
  transition:transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
}
.island.expanded .ai-indicator,.island.has-card .ai-indicator{
  flex-shrink:1;min-width:0;overflow:hidden;
}
.ai-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;transition:background 0.3s,box-shadow 0.3s}
.ai-dot.idle{background:#6b7280;box-shadow:0 0 4px rgba(107,114,128,0.3)}
.ai-dot.thinking{background:#fbbf24;animation:ai-breathe 1.5s ease-in-out infinite;box-shadow:0 0 8px rgba(251,191,36,0.65)}
.ai-dot.working{background:#34d399;animation:ai-pulse 0.8s ease-in-out infinite;box-shadow:0 0 8px rgba(52,211,153,0.65)}
.ai-dot.error{background:#f87171;box-shadow:0 0 8px rgba(248,113,113,0.65)}
.ai-dot.notification{background:#a78bfa;animation:ai-pulse 0.6s ease-in-out infinite;box-shadow:0 0 8px rgba(167,139,250,0.8)}
.ai-dot.done{background:#66bb6a;animation:ai-flash 0.3s ease 3}
@keyframes ai-breathe{0%,100%{opacity:0.4;transform:scale(0.85)}50%{opacity:1;transform:scale(1.15)}}
@keyframes ai-pulse{0%,100%{opacity:0.5;transform:scale(0.9)}50%{opacity:1;transform:scale(1.18)}}
@keyframes ai-flash{0%,100%{opacity:1}50%{opacity:0.2;transform:scale(1.3)}}
.ai-label{
  font-size:11px;color:rgba(255,255,255,0.78);white-space:nowrap;font-weight:500;letter-spacing:0.3px;flex-shrink:0;
  transition:color 0.25s ease;
}
.ai-label.active{color:#fff;font-weight:600}
.working-count-badge{
  font-size:9.5px;font-weight:600;padding:0 5px;
  height:16px;line-height:16px;border-radius:8px;
  background:rgba(52,211,153,0.18);color:#34d399;
  border:1px solid rgba(52,211,153,0.32);
  display:inline-flex;align-items:center;justify-content:center;
  flex-shrink:0;white-space:nowrap;
}
.island-actions{
  display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-shrink:0;white-space:nowrap;
  max-width:16px;opacity:1;margin-left:0;overflow:hidden;
  transform:scale(1);transform-origin:right center;
  transition:max-width 0.3s cubic-bezier(0.16, 1, 0.3, 1),
             margin-left 0.3s cubic-bezier(0.16, 1, 0.3, 1),
             opacity 0.22s ease,
             transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
}
.island.expanded .island-actions,.island.has-card .island-actions{
  max-width:160px;
}
.btn-console{
  display:inline-flex;
  align-items:center;gap:4px;flex-shrink:0;white-space:nowrap;
  max-width:0;opacity:0;padding:2px 0;border:0 solid rgba(255,255,255,0.12);
  margin-right:-6px;overflow:hidden;pointer-events:none;
  border-radius:4px;
  font-size:10px;font-weight:500;cursor:pointer;
  background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.75);
  transition:max-width 0.28s cubic-bezier(0.16, 1, 0.3, 1),
             opacity 0.18s ease,
             padding 0.28s cubic-bezier(0.16, 1, 0.3, 1),
             margin-right 0.28s cubic-bezier(0.16, 1, 0.3, 1),
             background 0.2s ease,color 0.2s ease,border-color 0.2s ease;
  line-height:1.4;
}
.btn-console:hover{
  background:rgba(255,255,255,0.12);color:#fff;
  border-color:rgba(255,255,255,0.22);
}
.island.expanded .btn-console{
  max-width:120px;opacity:1;padding:2px 7px;border-width:1px;margin-right:0;pointer-events:auto;
  transition:max-width 0.28s cubic-bezier(0.16, 1, 0.3, 1),
             opacity 0.22s ease 0.05s,
             padding 0.28s cubic-bezier(0.16, 1, 0.3, 1),
             margin-right 0.28s cubic-bezier(0.16, 1, 0.3, 1),
             background 0.2s ease,color 0.2s ease,border-color 0.2s ease;
}
.expand-arrow{
  color:rgba(255,255,255,0.45);flex-shrink:0;
  transition:transform 0.25s cubic-bezier(0.16, 1, 0.3, 1),color 0.15s;
  display:flex;align-items:center;justify-content:center;
  width:12px;height:12px;
}
.island-row:hover .expand-arrow{color:rgba(255,255,255,0.85)}
.expand-arrow.expanded{transform:rotate(180deg);color:#34d399}

/* 会话列表卡片 */
.sessions-card{
  display:none;
  width:100%;min-width:320px;flex-direction:column;flex-shrink:0;
  opacity:0;overflow:hidden;pointer-events:none;
  transition:opacity 0.22s ease,
             transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
  transform:translateY(-6px);
}
.island.expanded .sessions-card{
  display:flex;
}
.sessions-card.show{
  opacity:1;pointer-events:auto;
  transform:translateY(0);
  transition:opacity 0.24s ease 0.04s,
             transform 0.28s cubic-bezier(0.16, 1, 0.3, 1) 0.04s;
}
.sessions-card.collapsing{
  display:flex;
  position:absolute;
  top:36px;
  left:50%;
  opacity:0;
  transform:translateY(-6px);
  pointer-events:none;
  transition:opacity 0.16s ease,
             transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
}
.sessions-list{
  display:flex;flex-direction:column;gap:5px;flex-shrink:0;
  padding:8px 10px 10px;max-height:300px;overflow-y:auto;
}
.sessions-list::-webkit-scrollbar{width:5px}
.sessions-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.16);border-radius:3px}
.sessions-list::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.28)}
.sessions-list::-webkit-scrollbar-track{background:transparent}
.sessions-empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;
  padding:24px 12px;gap:6px;color:rgba(255,255,255,0.45);text-align:center;
}
.empty-icon-svg{opacity:0.4;margin-bottom:2px}
.empty-text{font-size:11.5px;font-weight:500;color:rgba(255,255,255,0.72)}
.empty-sub{font-size:10px;color:rgba(255,255,255,0.35)}
.session-item{
  display:flex;align-items:center;gap:10px;flex-shrink:0;
  padding:8px 10px;border-radius:8px;
  background:rgba(255,255,255,0.035);
  border:1px solid rgba(255,255,255,0.06);
  transition:background 0.15s,border-color 0.15s,transform 0.15s;
  cursor:pointer;
}
.session-item:hover{
  background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.14);
  transform:translateY(-1px);
}
.session-item:active{
  transform:scale(0.99);
}
.session-item.working{
  background:rgba(52,211,153,0.08);border-color:rgba(52,211,153,0.32);
  box-shadow:inset 0 0 10px rgba(52,211,153,0.05);
}
.session-item.thinking{
  background:rgba(251,191,36,0.08);border-color:rgba(251,191,36,0.32);
  box-shadow:inset 0 0 10px rgba(251,191,36,0.05);
}
.session-logo{
  display:flex;align-items:center;justify-content:center;
  width:26px;height:26px;border-radius:6px;flex-shrink:0;
}
.badge-claude{background:rgba(217,119,87,0.15);border:1px solid rgba(217,119,87,0.3)}
.badge-antigravity{background:rgba(66,133,244,0.12);border:1px solid rgba(155,114,203,0.3)}
.badge-zcode{background:rgba(37,99,235,0.15);border:1px solid rgba(6,182,212,0.35)}
.session-info{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.session-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.session-title-text{
  font-size:11.5px;font-weight:600;color:#f3f4f6;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  flex:1;min-width:0;
}
.session-tag{
  display:inline-flex;align-items:center;gap:4px;
  font-size:9.5px;padding:1px 6px;border-radius:4px;
  flex-shrink:0;font-weight:500;white-space:nowrap;
  background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.65);
}
.session-tag .tag-dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.session-tag.working{background:rgba(52,211,153,0.18);color:#34d399;font-weight:600}
.session-tag.working .tag-dot{animation:ai-pulse 0.8s ease-in-out infinite}
.session-tag.thinking{background:rgba(251,191,36,0.18);color:#fbbf24;font-weight:600}
.session-tag.thinking .tag-dot{animation:ai-breathe 1.5s ease-in-out infinite}
.session-tag.notification{background:rgba(167,139,250,0.2);color:#c4b5fd}
.session-tag.error{background:rgba(248,113,113,0.2);color:#fca5a5}
.session-tag.done{background:rgba(102,187,106,0.2);color:#81c784}
.session-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.session-meta{
  font-size:10px;color:rgba(255,255,255,0.45);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-family:Consolas,'Segoe UI',system-ui,sans-serif;
  flex:1;min-width:0;
}
.session-time{font-size:9.5px;color:rgba(255,255,255,0.35);flex-shrink:0;white-space:nowrap}

/* 权限卡片：宽按内容自适应 [320,520]，长参数在 .perm-body 内纵向滚动 */
.perm-card{width:100%;min-width:318px;max-width:518px;padding:0;display:none;flex-direction:column;flex-shrink:0;word-break:break-word}
.perm-card.show{display:flex;animation:perm-in 0.22s cubic-bezier(0.4,0,0.2,1)}
@keyframes perm-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.perm-banner{display:flex;align-items:center;gap:8px;padding:8px 14px;background:rgba(255,255,255,0.04);border-top:1px solid rgba(255,255,255,0.1);border-bottom:1px solid rgba(255,255,255,0.06)}
.perm-banner-dot{width:7px;height:7px;border-radius:50%;background:#e8e8f0;animation:ai-pulse 0.9s ease-in-out infinite;box-shadow:0 0 8px rgba(232,232,240,0.5);flex-shrink:0}
.perm-banner-text{font-size:11px;font-weight:600;color:#e8e8f0;letter-spacing:0.4px}
.perm-body{display:flex;flex-direction:column;gap:10px;padding:12px 14px 10px;max-height:300px;overflow-y:auto;flex-shrink:0}
.perm-row{display:flex;flex-direction:column;gap:4px}
.perm-row-label{font-size:9px;color:rgba(255,255,255,0.38);text-transform:uppercase;letter-spacing:0.6px;font-weight:600}
.perm-tool{font-size:13px;color:#34d399;font-weight:600;font-family:Consolas,'Courier New',monospace}
.perm-input{font-size:10.5px;color:rgba(255,255,255,0.78);font-family:Consolas,'Courier New',monospace;background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.06);border-radius:5px;padding:6px 8px;word-break:normal;overflow-wrap:anywhere;line-height:1.5;white-space:pre-wrap}
.perm-actions{display:flex;gap:6px;padding:0 14px 12px}
.perm-btn{flex:1;padding:7px 8px;border:none;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;transition:all 0.15s;letter-spacing:0.3px}
.perm-btn.allow{background:#34d399;color:#0a0a14}
.perm-btn.allow:hover{background:#10b981;box-shadow:0 2px 8px rgba(52,211,153,0.35)}
.perm-btn.deny{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.1)}
.perm-btn.deny:hover{background:rgba(248,113,113,0.18);color:#fca5a5;border-color:rgba(248,113,113,0.4)}
.perm-btn.always{background:rgba(52,211,153,0.1);color:#6ee7b7;border:1px solid rgba(52,211,153,0.28)}
.perm-btn.always:hover{background:rgba(52,211,153,0.18);border-color:rgba(52,211,153,0.5)}

/* 提问卡片 */
.question-card{width:100%;min-width:318px;max-width:518px;padding:0;display:none;flex-direction:column;flex-shrink:0;word-break:break-word}
.question-card.show{display:flex;animation:perm-in 0.22s cubic-bezier(0.4,0,0.2,1)}
.question-banner{display:flex;align-items:center;gap:8px;padding:8px 14px;background:rgba(255,255,255,0.04);border-top:1px solid rgba(255,255,255,0.1);border-bottom:1px solid rgba(255,255,255,0.06)}
.question-banner-dot{width:7px;height:7px;border-radius:50%;background:#fbbf24;animation:ai-breathe 1.2s ease-in-out infinite;box-shadow:0 0 8px rgba(251,191,36,0.6);flex-shrink:0}
.question-banner-text{font-size:11px;font-weight:600;color:#fde68a;letter-spacing:0.4px}
.question-progress{margin-left:auto;font-size:10px;font-weight:600;color:rgba(253,230,138,0.9);letter-spacing:0.3px}
.question-body{display:flex;flex-direction:column;gap:8px;padding:12px 14px 10px;max-height:300px;overflow-y:auto;flex-shrink:0}
.question-text{font-size:12px;color:#fff;font-weight:600;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.question-opt{display:flex;flex-direction:column;gap:3px;padding:6px 8px;background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.06);border-radius:6px}
.question-opt.selectable{cursor:pointer;border:1px solid rgba(255,255,255,0.08);transition:all 0.12s}
.question-opt.selectable:hover{border-color:rgba(251,191,36,0.4);background:rgba(251,191,36,0.07)}
.question-opt.selectable.selected{border-color:rgba(52,211,153,0.65);background:rgba(52,211,153,0.12)}
.qmark{display:inline-flex;align-items:center;justify-content:center;width:11px;height:11px;border-radius:50%;margin-right:6px;font-size:8px;color:rgba(255,255,255,0.55);border:1px solid rgba(255,255,255,0.35);flex-shrink:0}
.qmark.multi{border-radius:3px}
.question-opt.selectable.selected .qmark{background:#34d399;border-color:#34d399;color:#0a0a14}
.question-other{width:100%;margin-top:6px;padding:6px 8px;border:none;border-radius:6px;background:rgba(0,0,0,0.4);color:#fff;font-size:11px;outline:none;border:1px solid rgba(251,191,36,0.35)}
.question-close{margin-left:auto;cursor:pointer;font-size:13px;color:rgba(255,255,255,0.55);padding:0 4px;line-height:1;display:none}
.question-close:hover{color:#fca5a5}
.question-opt-label{font-size:11.5px;color:#6ee7b7;font-weight:600}
.question-opt-desc{font-size:10.5px;color:rgba(255,255,255,0.72);line-height:1.4;white-space:pre-wrap;word-break:break-word}
.question-hint{font-size:9.5px;color:rgba(255,255,255,0.4);line-height:1.4}
.question-actions{display:flex;padding:0 14px 12px}
.question-btn{flex:1;padding:7px 8px;border:none;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;transition:all 0.15s;letter-spacing:0.3px;background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.1)}
.question-btn:hover{background:rgba(251,191,36,0.14);color:#fde68a;border-color:rgba(251,191,36,0.4)}
.question-btn:disabled{opacity:0.35;cursor:default}
.question-btn:disabled:hover{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.8);border-color:rgba(255,255,255,0.1)}
.perm-body::-webkit-scrollbar,.question-body::-webkit-scrollbar{width:7px}
.perm-body::-webkit-scrollbar-thumb,.question-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.16);border-radius:4px}
.perm-body::-webkit-scrollbar-thumb:hover,.question-body::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.3)}
.perm-body::-webkit-scrollbar-track,.question-body::-webkit-scrollbar-track{background:transparent}

/* 横条态：贴顶细胶囊，高 16px，下圆角与细微阴影；内容走 GPU scale 避免 font-size 动画引起的重排/闪烁 */
body.flat .island:not(.expanded):not(.has-card){
  height:16px;
  background:rgba(18,18,28,0.95);
  border-color:rgba(255,255,255,0.09);border-top-color:transparent;
  border-radius:0 0 10px 10px;
  box-shadow:0 3px 12px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.03);
}
body.flat .island:not(.expanded):not(.has-card) .island-row{
  height:14px;padding:0 18px;gap:6px;
  border-radius:0 0 10px 10px;
}
body.flat .island:not(.expanded):not(.has-card) .ai-indicator{
  transform:scale(0.84);
}
body.flat .island:not(.expanded):not(.has-card) .ai-label{
  color:rgba(255,255,255,0.68);
}
body.flat .island:not(.expanded):not(.has-card) .ai-label.active{
  color:#fff;
}
body.flat .island:not(.expanded):not(.has-card) .island-actions{
  max-width:0;opacity:0;margin-left:-6px;pointer-events:none;
  transform:scale(0.5);
}
</style>
</head>
<body>
<div class="island" id="island">
  <div class="island-row" id="islandRow" title="点击展开/收起会话列表，双击打开控制台">
    <div class="ai-indicator" id="aiIndicator">
      <span class="ai-dot idle" id="aiDot"></span>
      <span class="ai-label" id="aiLabel">空闲</span>
      <span class="working-count-badge" id="workingCountBadge" style="display:none">0</span>
    </div>
    <div class="island-actions" id="islandActions">
      <button class="btn-console" id="openAiWindowBtn" title="打开 AI 控制台">
        <svg viewBox="0 0 16 16" width="10" height="10" fill="currentColor">

function syncHasCardClass() {

  return hasCard

let textMeasureSpan = null
function measureTextWidth(text, refEl) {
  if (!text || !refEl) return 0
  if (!textMeasureSpan) {
    textMeasureSpan = document.createElement('span')
    textMeasureSpan.setAttribute('aria-hidden', 'true')
    textMeasureSpan.style.cssText = 'position:fixed;left:-9999px;top:-9999px;visibility:hidden;pointer-events:none;white-space:nowrap;'
    document.body.appendChild(textMeasureSpan)
  }
  const cs = getComputedStyle(refEl)
  textMeasureSpan.style.fontFamily = cs.fontFamily
  textMeasureSpan.style.fontSize = cs.fontSize
  textMeasureSpan.style.fontWeight = cs.fontWeight
  textMeasureSpan.style.fontStyle = cs.fontStyle
  textMeasureSpan.style.letterSpacing = cs.letterSpacing
  textMeasureSpan.textContent = text
  return Math.ceil(textMeasureSpan.getBoundingClientRect().width)
}

function measureExpandedHeaderWidth() {
  const lb = document.getElementById('aiLabel')
  const badge = document.getElementById('workingCountBadge')
  const btnText = document.getElementById('openConsoleBtnText')
  const titleW = lb ? measureTextWidth(S.sessionsTitle, lb) : 50
  const workingCount = currentSessions.filter(s => s.state === 'working' || s.state === 'thinking').length
  const totalCount = currentSessions.length
  const badgeText = workingCount > 0
    ? S.workingCount.replace('{n}', workingCount)
    : (totalCount > 0 ? S.sessionsCount.replace('{n}', totalCount) : '')
  const badgeW = (badge && badgeText) ? measureTextWidth(badgeText, badge) + 12 : 0
  const consoleTextW = btnText ? measureTextWidth(S.console, btnText) : 34
  return Math.ceil(2 + 24 + 8 + 6 + titleW + (badgeW ? 6 + badgeW : 0) + 12 + (consoleTextW + 34) + 6 + 12 + 4)
}

function computeSessionsCardWidth() {
  let maxContent = Math.max(340, measureExpandedHeaderWidth())
  const listEl = document.getElementById('sessionsList')
  if (listEl && currentSessions.length > 0) {
    // 2px .island 边框 + 20px 列表内边距 + 22px 卡片项边距边框 + 36px 图标间距 + 8px 行内间距 + 4px 余量
    const scrollExtra = listEl.scrollHeight > 300 ? 6 : 0
    const chromeW = 92 + scrollExtra
    const items = listEl.querySelectorAll('.session-item')
    for (const it of items) {
      const top = it.querySelector('.session-top')
      const bottom = it.querySelector('.session-bottom')
      if (top && bottom) {
        const titleEl = top.querySelector('.session-title-text')
        const tagEl = top.querySelector('.session-tag')
        const metaEl = bottom.querySelector('.session-meta')
        const timeEl = bottom.querySelector('.session-time')
        const titleW = titleEl ? measureTextWidth(titleEl.textContent, titleEl) : 0
        const tagW = tagEl ? (tagEl.offsetWidth || measureTextWidth(tagEl.textContent, tagEl) + 22) : 0
        const metaW = metaEl ? measureTextWidth(metaEl.textContent, metaEl) : 0
        const timeW = timeEl ? (timeEl.offsetWidth || measureTextWidth(timeEl.textContent, timeEl)) : 0
        const row1 = titleW + tagW + chromeW
        const row2 = metaW + timeW + chromeW
        maxContent = Math.max(maxContent, row1, row2)
      }
    }
  }
  return Math.min(Math.max(maxContent, 340), 520)
}

function measureSessionsLayout() {
  const sessionsCard = document.getElementById('sessionsCard')
  if (!sessionsCard) return { width: 340, height: 180 }

  // 未展开前 .sessions-card 处于 display:none，临时离屏可见测量真实宽高，避免读出 0 造成展开裁剪
  const wasHidden = getComputedStyle(sessionsCard).display === 'none' || sessionsCard.classList.contains('collapsing')
  const savedStyle = sessionsCard.getAttribute('style')
  const hadCollapsing = sessionsCard.classList.contains('collapsing')

  if (wasHidden) {
    if (hadCollapsing) sessionsCard.classList.remove('collapsing')
    sessionsCard.style.cssText = 'display:flex !important;position:fixed !important;left:-9999px !important;top:0 !important;visibility:hidden !important;pointer-events:none !important;transition:none !important;width:340px !important;min-width:0 !important;max-width:none !important;height:auto !important;'
    void sessionsCard.offsetHeight
  }

  const width = computeSessionsCardWidth()
  if (wasHidden) {
    sessionsCard.style.width = (width - 2) + 'px'
    void sessionsCard.offsetHeight
  }
  const height = Math.min(38 + Math.ceil(sessionsCard.getBoundingClientRect().height), 468)

  if (wasHidden) {
    if (savedStyle === null) sessionsCard.removeAttribute('style')
    else sessionsCard.setAttribute('style', savedStyle)
    if (hadCollapsing && !isSessionsExpanded) sessionsCard.classList.add('collapsing')
  }

  return { width, height }
}

function measureCardLayout(card) {
  if (!card) return { width: 320, height: 140 }
  const savedStyle = card.getAttribute('style')
  card.style.cssText = 'display:flex !important;position:fixed !important;left:-9999px !important;top:0 !important;visibility:hidden !important;pointer-events:none !important;transition:none !important;width:max-content !important;min-width:318px !important;max-width:518px !important;height:auto !important;'
  void card.offsetHeight
  const naturalW = Math.ceil(card.getBoundingClientRect().width)
  const width = Math.min(Math.max(naturalW + 2, 320), 520)
  card.style.width = (width - 2) + 'px'
  void card.offsetHeight
  const cardH = Math.ceil(card.getBoundingClientRect().height)
  if (savedStyle === null) card.removeAttribute('style')
  else card.setAttribute('style', savedStyle)
  return {
    width,
    height: Math.min(38 + cardH, 468),
  }
}

function measureSessionsCardWidth() {
  return measureSessionsLayout().width
}

function measureCapsuleWidth(forFlat = document.body.classList.contains('flat')) {
  const lb = document.getElementById('aiLabel')
  const badge = document.getElementById('workingCountBadge')
  const currentState = currentGlobalState || 'idle'
  const labelText = aiLabels()[currentState] || S.idle
  const labelW = lb ? measureTextWidth(labelText, lb) : 24
  const workingCount = currentSessions.filter(s => s.state === 'working' || s.state === 'thinking').length
  const badgeText = workingCount > 0 ? S.workingCount.replace('{n}', workingCount) : ''
  const badgeW = (badge && badgeText) ? measureTextWidth(badgeText, badge) + 12 : 0
  // 8px dot + 6px gap + label + (可选工作数量徽标)
  const indW = 8 + 6 + labelW + (badgeW ? 6 + badgeW : 0)
  if (forFlat) {
    return Math.max(Math.ceil(indW) + 38, 210)
  }
  // 默认小胶囊态：indicator + 6px gap + 12px arrow + 左右 13px padding (26px) + 2px border + 2px DPI 取整余量
  const naturalW = indW + 12 + 6 + 26 + 2 + 2
  return Math.max(Math.ceil(naturalW), 88)
}

function computeTargetIslandBox() {
  const q = document.getElementById('questionCard')
  const p = document.getElementById('permCard')
  const hasCard = syncHasCardClass()
  if (q.classList.contains('show')) return measureCardLayout(q)
  if (p.classList.contains('show')) return measureCardLayout(p)
  if (isSessionsExpanded) return measureSessionsLayout()
  const isFlat = document.body.classList.contains('flat') && !hasCard
  return {
    width: measureCapsuleWidth(isFlat),
    height: isFlat ? 16 : 38,
  }
}

function ensureIslandSizedFromCurrent() {
  const island = document.getElementById('island')
  if (island.style.width && island.style.height) return
  const r = island.getBoundingClientRect()
  island.style.transition = 'none'
  if (!island.style.width) island.style.width = Math.max(Math.round(r.width), 88) + 'px'
  if (!island.style.height) island.style.height = Math.max(Math.round(r.height), 16) + 'px'
  void island.offsetWidth
  island.style.transition = ''
}

function applyIslandBox(targetW, targetH, skipCssTransition = false) {
  const island = document.getElementById('island')
  if (skipCssTransition) {
    island.style.transition = 'none'
    island.style.width = targetW + 'px'
    island.style.height = targetH + 'px'
    void island.offsetWidth
    island.style.transition = ''
  } else {
    ensureIslandSizedFromCurrent()
    island.style.width = targetW + 'px'
    island.style.height = targetH + 'px'
  }
  if (targetW !== lastW || targetH !== lastH) {
    lastW = targetW
    lastH = targetH
    invoke('resize_ai_island', { contentWidth: targetW, contentHeight: targetH })
  }
}

function syncIslandNow(skipCssTransition = false) {
  clearTimeout(resizeDebounceId)
  cancelAnimationFrame(resizeRafId)
  const { width, height } = computeTargetIslandBox()
  applyIslandBox(width, height, skipCssTransition)
}

function fitIslandWidth() {
  syncIslandNow(false)
}

function resizeIsland(immediate = false) {
  clearTimeout(resizeDebounceId)
  const doResize = () => {
    cancelAnimationFrame(resizeRafId)
    resizeRafId = requestAnimationFrame(() => {
      const { width, height } = computeTargetIslandBox()
      applyIslandBox(width, height, false)
    })
  }
  if (immediate) {
    doResize()
  } else {
    resizeDebounceId = setTimeout(doResize, 8)
  }
}

const contentResizeObserver = new ResizeObserver(() => {
  if (isCollapsingSessions) return
  resizeIsland()

function isAntigravitySession(s) {
  return s.agentId === 'antigravity' || (typeof s.model === 'string' && s.model.toLowerCase().includes('gemini'))

function isZcodeSession(s) {
  return s.agentId === 'zcode' || (typeof s.model === 'string' && (s.model.toLowerCase().includes('glm') || s.model.toLowerCase().includes('zcode')))
}

function getSessionTitle(s) {
  if (typeof s.title === 'string' && s.title.trim()) return s.title
  if (isAntigravitySession(s)) return `Antigravity · ${typeof s.sessionId === 'string' ? s.sessionId.slice(0, 8) : ''}`
  if (isZcodeSession(s)) return `ZCode · ${typeof s.sessionId === 'string' ? s.sessionId.slice(0, 8) : ''}`
  return `Claude · ${typeof s.sessionId === 'string' ? s.sessionId.slice(0, 8) : ''}`
}

      'run_command': '命令', 'write_file': '写文件', 'edit_file': '编辑', 'read_file': '读文件',
      'Bash': 'Bash', 'FileEdit': '编辑', 'FileWrite': '写文件', 'Edit': '编辑', 'Write': '写文件',
      'Read': '读文件', 'Agent': '智能体',
    }
    parts.push(toolMap[s.toolName] || s.toolName)
  }
  if (!parts.length) {
    const short = typeof s.sessionId === 'string' ? s.sessionId.slice(0, 8) : ''
    if (short) parts.push(short)
  }
  return parts.join(' · ')
}

function formatTimeAgo(ts) {
  if (!ts) return ''
  const diff = Math.max(0, Date.now() - ts)
  const sec = Math.floor(diff / 1000)
  const isEn = S.console === 'Console'
  if (sec < 10) return isEn ? 'just now' : '刚刚'
  if (sec < 60) return isEn ? `${sec}s ago` : `${sec}秒前`
  const min = Math.floor(sec / 60)
  if (min < 60) return isEn ? `${min}m ago` : `${min}分钟前`
  const hr = Math.floor(min / 60)
  return isEn ? `${hr}h ago` : `${hr}小时前`
}

function updateWorkingBadge() {
  const badge = document.getElementById('workingCountBadge')
  if (!badge) return
  const workingCount = currentSessions.filter(s => s.state === 'working' || s.state === 'thinking').length
  const totalCount = currentSessions.length
  if (workingCount > 0) {
    badge.textContent = S.workingCount.replace('{n}', workingCount)
    badge.style.display = 'inline-flex'
    badge.title = `${workingCount} active`
  } else if (isSessionsExpanded && totalCount > 0) {
    badge.textContent = S.sessionsCount.replace('{n}', totalCount)
    badge.style.display = 'inline-flex'
    badge.title = `${totalCount} total`
  } else {
    badge.style.display = 'none'
  }
}

let lastSessionsRenderKey = ''

function buildSessionsRenderKey(list) {
  const head = `${S.noActive}|${S.noActiveSub}|${S.console}|${S.tagIdle}|${S.tagThinking}|${S.tagWorking}|${S.tagError}|${S.tagNotification}|${S.tagDone}`
  if (!list || list.length === 0) return `${head}|empty`
  return head + '|' + list.map((s) =>
    `${s.sessionId || ''}:${s.agentId || ''}:${s.state || 'idle'}:${getSessionTitle(s)}:${formatSessionMeta(s)}:${formatTimeAgo(s.updatedAt)}`
  ).join(';')
}

function renderSessions() {
  const listEl = document.getElementById('sessionsList')
  if (!listEl) return
  const nextKey = buildSessionsRenderKey(currentSessions)
  if (nextKey === lastSessionsRenderKey && listEl.children.length > 0) return
  lastSessionsRenderKey = nextKey
  const totalCount = currentSessions.length
  listEl.innerHTML = ''

  if (totalCount === 0) {
    const empty = document.createElement('div')
    empty.className = 'sessions-empty'
    empty.innerHTML = `
      <svg class="empty-icon-svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="13" rx="2.5"/>
        <path d="M8 20h8M12 17v3M8 9h2M8 12h5"/>
      </svg>
      <div class="empty-text">${S.noActive}</div>
      <div class="empty-sub">${S.noActiveSub}</div>
    `
    listEl.appendChild(empty)
    return
  }

  const priority = (st) => {
    if (st === 'working') return 1
    if (st === 'thinking') return 2
    if (st === 'notification') return 3
    if (st === 'error') return 4
    if (st === 'done') return 5
    return 6
  }
  const sorted = [...currentSessions].sort((a, b) => {
    const pa = priority(a.state || 'idle')
    const pb = priority(b.state || 'idle')
    if (pa !== pb) return pa - pb
    return (b.updatedAt || 0) - (a.updatedAt || 0)
  })

  for (const s of sorted) {
    const isAnti = isAntigravitySession(s)
    const isZ = isZcodeSession(s)
    const isWorking = s.state === 'working' || s.state === 'thinking'
    const item = document.createElement('div')
    item.className = `session-item ${s.state || 'idle'} ${isWorking ? 'working' : ''}`
    item.title = '点击在控制台中查看'
    item.addEventListener('click', (e) => {
      e.stopPropagation()
      collapseSessions()
      invoke('show_ai_window')
    })

    const logoDiv = document.createElement('div')
    const badgeClass = isAnti ? 'badge-antigravity' : (isZ ? 'badge-zcode' : 'badge-claude')
    const svgIcon = isAnti ? ANTIGRAVITY_SVG : (isZ ? ZCODE_SVG : CLAUDE_SVG)
    logoDiv.className = `session-logo ${badgeClass}`
    logoDiv.innerHTML = svgIcon
    item.appendChild(logoDiv)

    const info = document.createElement('div')
    info.className = 'session-info'

    const topRow = document.createElement('div')
    topRow.className = 'session-top'
    
    const nameSpan = document.createElement('span')
    nameSpan.className = 'session-title-text'
    nameSpan.textContent = getSessionTitle(s)
    nameSpan.title = getSessionTitle(s)
    topRow.appendChild(nameSpan)

    const stateTag = document.createElement('span')
    stateTag.className = `session-tag ${s.state || 'idle'}`
    const stateText = sessionTagLabels()[s.state] || s.state || S.tagIdle
    stateTag.innerHTML = `<span class="tag-dot"></span>${stateText}`
    topRow.appendChild(stateTag)

    info.appendChild(topRow)

    const bottomRow = document.createElement('div')
    bottomRow.className = 'session-bottom'

    const metaSpan = document.createElement('span')
    metaSpan.className = 'session-meta'
    metaSpan.textContent = formatSessionMeta(s)
    bottomRow.appendChild(metaSpan)

    if (s.updatedAt) {
      const timeSpan = document.createElement('span')
      timeSpan.className = 'session-time'
      timeSpan.textContent = formatTimeAgo(s.updatedAt)
      bottomRow.appendChild(timeSpan)
    }

    info.appendChild(bottomRow)
    item.appendChild(info)
    listEl.appendChild(item)
  }
}

function toggleSessions() {
  if (isSessionsExpanded) {
    collapseSessions()
  } else {
    expandSessions()
  }
}

function expandSessions() {
  const q = document.getElementById('questionCard')
  const p = document.getElementById('permCard')
  if (q.classList.contains('show') || p.classList.contains('show')) return
  if (isSessionsExpanded) return

  const gen = ++transitionGen
  clearTimeout(transitionTimeoutId)
  isCollapsingSessions = false
  isSessionsExpanded = true

  const island = document.getElementById('island')
  const sessionsCard = document.getElementById('sessionsCard')
  ensureIslandSizedFromCurrent()
  sessionsCard.classList.remove('collapsing')
  sessionsCard.style.width = ''
  sessionsCard.style.marginLeft = ''

  renderSessions()
  const { width: targetW, height: targetH } = measureSessionsLayout()

  if (!document.hasFocus()) window.focus()
  updateHeaderDisplay()
  island.classList.add('expanded')
  document.getElementById('expandArrow').classList.add('expanded')
  // 强制提交 display:flex 与 opacity:0 / translateY(-6px)，避免从 display:none 切换时跳过淡入动画
  void getComputedStyle(sessionsCard).opacity
  sessionsCard.classList.add('show')
  applyIslandBox(targetW, targetH, false)

  invoke('agent_get_status').then((s) => {
    if (gen !== transitionGen || !isSessionsExpanded) return
    if (s && Array.isArray(s.sessions)) {
      currentSessions = s.sessions
    }
    if (s && s.displayState) {
      currentGlobalState = s.displayState
    }
    updateHeaderDisplay()
    renderSessions()
    if (isSessionsExpanded && !isCollapsingSessions) {
      const latest = measureSessionsLayout()
      applyIslandBox(latest.width, latest.height, false)
    }
  }).catch(() => {})
}

function collapseSessions(immediate = false) {
  if (!isSessionsExpanded) return

  const gen = ++transitionGen
  clearTimeout(transitionTimeoutId)
  isSessionsExpanded = false

  const island = document.getElementById('island')
  const sessionsCard = document.getElementById('sessionsCard')
  const isFlat = document.body.classList.contains('flat')
  const collapsedW = measureCapsuleWidth(isFlat)
  const collapsedH = isFlat ? 16 : 38

  if (immediate) {
    isCollapsingSessions = false
    sessionsCard.classList.remove('show', 'collapsing')
    sessionsCard.style.width = ''
    sessionsCard.style.marginLeft = ''
    document.getElementById('expandArrow').classList.remove('expanded')
    island.classList.remove('expanded')
    updateHeaderDisplay()
    applyIslandBox(collapsedW, collapsedH, true)
    return
  }

  isCollapsingSessions = true
  ensureIslandSizedFromCurrent()
  const cardW = Math.max(Math.round(sessionsCard.getBoundingClientRect().width), 320)
  sessionsCard.style.width = cardW + 'px'
  sessionsCard.style.marginLeft = -Math.round(cardW / 2) + 'px'

  // 脱离 flex 文档流并保持居中宽度，同时移除 .show 触发平滑淡出；.island-row 顶格固定不会下坠
  sessionsCard.classList.add('collapsing')
  sessionsCard.classList.remove('show')
  document.getElementById('expandArrow').classList.remove('expanded')
  island.classList.remove('expanded')
  updateHeaderDisplay()
  applyIslandBox(collapsedW, collapsedH, false)

  transitionTimeoutId = setTimeout(() => {
    if (gen !== transitionGen) return
    isCollapsingSessions = false
    sessionsCard.classList.remove('collapsing')
    sessionsCard.style.width = ''
    sessionsCard.style.marginLeft = ''
    resizeIsland()
  }, 280)
}
window.collapseSessions = collapseSessions

function applyState(data) {
  if (data && Array.isArray(data.sessions)) {
    currentSessions = data.sessions
  }
  currentGlobalState = (data && data.state) ? data.state : 'idle'
  updateHeaderDisplay()
  if (isSessionsExpanded) {
    renderSessions()
  }
  if (!isCollapsingSessions) {
    resizeIsland(true)
  }
}
window.applyState = applyState

function formatToolInput(input) {
  try {
    const priorityKeys = [
      'command', 'CommandLine', 'file_path', 'path', 'Path',
      'Target', 'Replacement', 'query', 'url', 'pattern',
      'Prompt', 'Role', 'TypeName'
    ]
    const lines = []
    for (const k of priorityKeys) {
      if (input[k] !== undefined) lines.push(k + ': ' + (typeof input[k] === 'object' ? JSON.stringify(input[k]) : String(input[k])))
    }
    for (const k of Object.keys(input)) {
      if (priorityKeys.includes(k)) continue
      const v = input[k]
      lines.push(k + ': ' + (typeof v === 'object' ? JSON.stringify(v) : String(v)))
    }
    return lines.join('\n')
  } catch { return JSON.stringify(input) }
}

  syncHasCardClass()

    'FileEdit': '编辑文件 (FileEdit)',

    'Edit': '编辑文件 (Edit)',
    'Write': '写入文件 (Write)',
    'Read': '读取文件 (Read)',
    'Agent': '子智能体 (Agent)',
  }

  }

}

// ===== 提问卡逐题推进 =====
let qList = []
let qIndex = 0
let qAnswerable = false
let qSessionId = ''
let qAgentId = ''
let qDrafts = []

function resolveQuestionHostName(agentId, sessionId) {
  let aid = agentId
  if (!aid && sessionId) {
    const sess = currentSessions.find((s) => s.sessionId === sessionId)
    if (sess) {
      if (isAntigravitySession(sess)) aid = 'antigravity'
      else if (isZcodeSession(sess)) aid = 'zcode'
      else if (sess.agentId) aid = sess.agentId
    }
  }
  if (aid === 'antigravity') return 'Antigravity'
  if (aid === 'zcode') return 'ZCode'
  return 'Claude Code'
}

function formatAnswerHint(agentId, sessionId) {
  const host = resolveQuestionHostName(agentId, sessionId)
  if (S.answerInAgent && S.answerInAgent.includes('{agent}')) {
    return S.answerInAgent.replace('{agent}', host)
  }
  return host === 'Claude Code' ? S.answerInClaude : `请到 ${host} 界面作答，这里仅作提醒。`
}

function currentDraft() {
  return qDrafts[qIndex] || (qDrafts[qIndex] = { selected: new Set(), otherText: '' })
}

/** 题目内容指纹：用于识别「同一张卡的重复推送」（题面/选项全等才认作同卡） */
function questionsFingerprint(list) {
  try { return JSON.stringify(list) } catch { return String(list && list.length) }
}

function renderCurrentQuestion() {
  const body = document.getElementById('questionBody')
  body.innerHTML = ''
  const total = qList.length
  const view = toQuestionItem(qList[qIndex] || qList[0], qIndex)
  const prog = document.getElementById('questionProgress')
  const pt = total > 1
    ? S.progress.replace('{n}', String(qIndex + 1)).replace('{t}', String(total))
    : null
  prog.style.display = pt ? 'inline' : 'none'
  prog.textContent = pt || ''
  const closeEl = document.getElementById('questionClose')

  const title = document.createElement('div')
  title.className = 'question-text'
  title.textContent = view.text
  body.appendChild(title)

  if (qAnswerable) {
    const item = qList[qIndex]
    const multi = multiSelectOf(item)
    const opts = withOther(view.options, OTHER())
    const draft = currentDraft()
    if (!opts.length) {
      // 无预设选项的开放式提问：提供直接文本输入，避免只能提交空字符串
      draft.selected.add(OTHER())
      const inp = document.createElement('input')
      inp.className = 'question-other'
      inp.placeholder = S.otherPlaceholder
      inp.value = draft.otherText || ''
      inp.addEventListener('click', (e) => e.stopPropagation())
      inp.addEventListener('input', () => { draft.otherText = inp.value })
      body.appendChild(inp)
    }
    opts.forEach((opt) => {
      const row = document.createElement('div')
      row.className = 'question-opt selectable' + (draft.selected.has(opt.label) ? ' selected' : '')
      const lab = document.createElement('div')
      lab.className = 'question-opt-label'
      const mark = document.createElement('span')
      mark.className = 'qmark' + (multi ? ' multi' : '')
      mark.textContent = multi ? '✓' : ''
      lab.appendChild(mark)
      lab.appendChild(document.createTextNode(opt.label))
      row.appendChild(lab)
      if (opt.desc) {
        const d = document.createElement('div')
        d.className = 'question-opt-desc'
        d.textContent = opt.desc
        row.appendChild(d)
      }
      row.addEventListener('click', () => {
        const r = toggleOption(draft.selected, opt.label, multi, OTHER())
        draft.selected = r.selected
        renderCurrentQuestion()
      })
      body.appendChild(row)
      if (opt.isOther && draft.selected.has(OTHER())) {
        const inp = document.createElement('input')
        inp.className = 'question-other'
        inp.placeholder = S.otherPlaceholder
        inp.value = draft.otherText || ''
        inp.addEventListener('click', (e) => e.stopPropagation())
        inp.addEventListener('input', () => { draft.otherText = inp.value })
        body.appendChild(inp)
        if (multi) {
          const h = document.createElement('div')
          h.className = 'question-hint'
          h.textContent = S.otherHint
          body.appendChild(h)
        }
      }
    })
    closeEl.style.display = 'inline-block'
    document.getElementById('questionBtn').textContent = (qIndex < total - 1) ? S.next : S.submit
  } else {
    view.options.forEach((opt) => {
      const row = document.createElement('div')
      row.className = 'question-opt'
      const lab = document.createElement('div')
      lab.className = 'question-opt-label'
      lab.textContent = opt.label
      row.appendChild(lab)
      if (opt.desc) {
        const d = document.createElement('div')
        d.className = 'question-opt-desc'
        d.textContent = opt.desc
        row.appendChild(d)
      }
      body.appendChild(row)
    })
    const hint = document.createElement('div')
    hint.className = 'question-hint'
    hint.textContent = formatAnswerHint(qAgentId, qSessionId)
    body.appendChild(hint)
    closeEl.style.display = 'none'
    document.getElementById('questionBtn').textContent = (qIndex < total - 1) ? S.next : S.know
  }
  document.getElementById('questionPrevBtn').disabled = qIndex <= 0
  fitIslandWidth()
  resizeIsland(true)
}

function resetQuestion() {
  qList = []
  qIndex = 0
  qAnswerable = false
  qSessionId = ''
  qAgentId = ''
  qDrafts = []
  document.getElementById('questionClose').style.display = 'none'
}

function applyQuestion(q) {
  const card = document.getElementById('questionCard')
  if (!q) {
    resetQuestion()
    card.classList.remove('show')
    syncHasCardClass()
    resizeIsland(true)
    return
  }
  document.getElementById('permCard').classList.remove('show')
  syncHasCardClass()
  const list = resolveQuestionList(q)
  const answerable = !!q.answerable
  const sessionId = q.sessionId || ''
  const agentId = q.agentId || ''
  // 同一张卡的重复推送（Rust push_card 走 eval + emit 双通道，页面两条都监听；
  // 窗口重建后也会 agent_get_status 重拉）必须保留答题进度与草稿 —— 早先无条件
  // qDrafts 重置 + qIndex=0，用户勾到第 3 题时一次重推就跳回第 1 题且选项清空。
  const sameCard = qList.length === list.length
    && qAnswerable === answerable
    && qSessionId === sessionId
    && qAgentId === agentId
    && questionsFingerprint(qList) === questionsFingerprint(list)
  if (!sameCard) {
    qList = list
    qAnswerable = answerable
    qSessionId = sessionId
    qAgentId = agentId
    qDrafts = list.map(() => ({ selected: new Set(), otherText: '' }))
  }
  if (!qList.length) qList = list
  renderCurrentQuestion()
  card.classList.add('show')
  syncHasCardClass()
  fitIslandWidth()
  resizeIsland(true)
}

function stepQuestion() {
  if (qIndex < qList.length - 1) { qIndex++; renderCurrentQuestion(); return }
  if (qAnswerable) {
    const payload = buildAnswers(qList, qDrafts, OTHER())
    invoke('agent_submit_question', { sessionId: qSessionId, answers: payload })
    document.getElementById('questionCard').classList.remove('show')
    syncHasCardClass()
    resetQuestion()
    resizeIsland(true)
  } else {
    dismissQuestion()
  }
}
function prevQuestion() { if (qIndex > 0) { qIndex--; renderCurrentQuestion() } }
function dismissQuestion() {
  invoke('agent_dismiss_question')
  document.getElementById('questionCard').classList.remove('show')
  syncHasCardClass()
  resizeIsland(true)
}

function applyCard(card) {
  if (!card) {
    document.getElementById('permCard').classList.remove('show')
    document.getElementById('questionCard').classList.remove('show')
    syncHasCardClass()
    resetQuestion()
    fitIslandWidth()
    resizeIsland(true)
    return
  }
  collapseSessions(true)
  if (card.kind === 'permission') { applyPermission(card); return }
  applyQuestion(card)
}
window.applyCard = applyCard

function resolvePerm(b) {
  invoke('agent_resolve_permission', { behavior: b })
  document.getElementById('permCard').classList.remove('show')
  syncHasCardClass()
  resizeIsland(true)
}

// ===== 横条态 =====
function setFlat(flat, immediate = false) {
  const isFlat = !!flat
  const wasFlat = document.body.classList.contains('flat')
  if (isFlat === wasFlat && !immediate) return

  if (immediate) {
    document.body.classList.toggle('flat', isFlat)
    if (isFlat) collapseSessions(true)
    syncIslandNow(true)
    return
  }

  // 若审批/提问卡片当前正在显示，只切换底层 flat 标志而不破坏卡片形态
  if (syncHasCardClass()) {
    document.body.classList.toggle('flat', isFlat)
    resizeIsland(true)
    return
  }

  if (isFlat && isSessionsExpanded) {
    document.body.classList.toggle('flat', true)
    collapseSessions(false)
    return
  }

  ensureIslandSizedFromCurrent()
  document.body.classList.toggle('flat', isFlat)
  if (isSessionsExpanded) {
    const { width, height } = measureSessionsLayout()
    applyIslandBox(width, height, false)
  } else {
    const targetW = measureCapsuleWidth(isFlat)
    const targetH = isFlat ? 16 : 38
    applyIslandBox(targetW, targetH, false)
  }
}
window.setFlat = setFlat

// 展开态失焦自动收起：点击其他窗口或桌面时自动收起会话列表，并确保放行鼠标穿透
function handleWindowBlur() {
  if (pointerDown) endDrag()
  if (dragging) return
  if (isSessionsExpanded) {
    collapseSessions()
  }
  lastInteractive = false
  invoke('set_ai_island_mouse_mode', { interactive: false })
}

listen('tauri://blur', handleWindowBlur)

// ===== 拖拽与点击（水平拖拽，4px 阈值区分点击展开/拖动）=====
const row = document.getElementById('islandRow')
let dsX = 0, dsY = 0, dragging = false, wasDragging = false, pointerDown = false
row.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return
  if (e.target && e.target.closest && e.target.closest('button')) return
  dsX = e.screenX; dsY = e.screenY; dragging = false; wasDragging = false; pointerDown = true
  row.setPointerCapture(e.pointerId)
  invoke('ai_island_drag_start', { sx: e.screenX, sy: e.screenY })
})
row.addEventListener('pointermove', (e) => {
  if (!pointerDown || (e.buttons & 1) === 0) return
  if (!dragging) {
    if (Math.abs(e.screenX - dsX) <= 4 && Math.abs(e.screenY - dsY) <= 4) return
    dragging = true
    row.classList.add('dragging')
  }
  invoke('ai_island_drag_move', { sx: e.screenX, sy: e.screenY })
})
const endDrag = (e) => {
  if (!pointerDown) return
  pointerDown = false
  if (e && e.pointerId !== undefined && row.hasPointerCapture && row.hasPointerCapture(e.pointerId)) {
    row.releasePointerCapture(e.pointerId)
  }
  row.classList.remove('dragging')
  if (dragging) {
    dragging = false
    wasDragging = true
    invoke('ai_island_drag_end')
    setTimeout(() => { wasDragging = false }, 180)
  } else {
    // 纯点击（未达 4px 拖动阈值）：清除 Rust 侧 drag 标志，
    // 否则 poll_tick 会把 560x480 置顶透明画布锁在不可穿透态，挡住下方窗口关闭按钮
    invoke('ai_island_drag_cancel')
  }
}
row.addEventListener('pointerup', endDrag)
row.addEventListener('pointercancel', endDrag)
row.addEventListener('lostpointercapture', endDrag)

row.addEventListener('click', (e) => {
  if (wasDragging || dragging) return
  if (e.target && e.target.closest && e.target.closest('.sessions-card')) return
  toggleSessions()
})

row.addEventListener('dblclick', (e) => {
  e.stopPropagation()
  invoke('show_ai_window')
})

// ===== 透明空白区穿透兜底（主通道是 Rust 16ms 自适应光标轮询）=====
// 只在交互/穿透**翻转**时 invoke：mousemove 以事件率（60-125Hz+）触发，
// 每次都 invoke 是持续 IPC 风暴；拖拽期间保持可交互、移出窗口立即放行穿透
let lastInteractive = null
function updateMouseMode(e) {
  if (dragging) return
  const onIsland = !!(e.target && e.target.closest && e.target.closest('.island'))
  if (onIsland === lastInteractive) return
  lastInteractive = onIsland
  invoke('set_ai_island_mouse_mode', { interactive: onIsland })
}
document.addEventListener('mousemove', updateMouseMode)
document.addEventListener('pointerdown', (e) => {
  if (dragging) return
  const onIsland = !!(e.target && e.target.closest && e.target.closest('.island'))
  if (!onIsland) {
    if (isSessionsExpanded) {
      collapseSessions(true)
    }
    lastInteractive = false
    invoke('set_ai_island_mouse_mode', { interactive: false })
  } else {
    updateMouseMode(e)
  }
})
document.addEventListener('mouseleave', () => {
  if (dragging) return
  if (lastInteractive !== false) {
    lastInteractive = false
    invoke('set_ai_island_mouse_mode', { interactive: false })
  }
})

// ===== 初始化：横条态 + 主动拉状态（避免错过创建前广播）=====
applyI18nText()
if (typeof window.__AI_FLAT__ === 'boolean') setFlat(window.__AI_FLAT__, true)
invoke('agent_get_status').then((s) => {
  if (!s) return
  applyState({ state: s.displayState, sessions: s.sessions || [] })
  if (s.currentCard) applyCard(s.currentCard)
}).catch(() => {})
syncIslandNow(true)
</script>
